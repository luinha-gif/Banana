<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mini Editor</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: #12141a;
    color: #e8e8ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 10px 14px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    border-bottom: 1px solid #23262f;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header .actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  header button {
    background: #23262f;
    color: #e8e8ec;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 500;
  }

  header button.primary {
    background: #4f7cff;
    color: #fff;
  }

  #saveStatus {
    font-size: 11px;
    color: #5c5f6a;
  }

  .tabs {
    display: flex;
    border-bottom: 1px solid #23262f;
    flex-shrink: 0;
  }

  .tabs button {
    flex: 1;
    background: none;
    border: none;
    color: #8a8d98;
    padding: 10px 0;
    font-size: 13px;
    font-weight: 600;
    border-bottom: 2px solid transparent;
  }

  .tabs button.active {
    color: #e8e8ec;
    border-bottom: 2px solid #4f7cff;
  }

  .toolbar {
    display: flex;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid #23262f;
    overflow-x: auto;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
  }

  .toolbar.hidden {
    display: none;
  }

  .toolbar button {
    background: #1c1f27;
    color: #b7bac3;
    border: 1px solid #2b2e38;
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .toolbar button.danger {
    color: #ff8080;
    border-color: #4a2a2a;
  }

  .toolbar button.highlight {
    color: #8fd6ff;
    border-color: #2a4a5a;
  }

  .panes {
    position: relative;
    flex: 1;
    min-height: 0;
  }

  .pane {
    position: absolute;
    inset: 0;
    display: none;
  }

  .pane.active {
    display: block;
  }

  textarea {
    width: 100%;
    height: 100%;
    resize: none;
    border: none;
    outline: none;
    background: #16181f;
    color: #d8dae0;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 13.5px;
    line-height: 1.5;
    padding: 12px;
    tab-size: 2;
    -webkit-appearance: none;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
  }

  footer {
    padding: 8px 14px;
    font-size: 11px;
    color: #5c5f6a;
    text-align: center;
    border-top: 1px solid #23262f;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header>
  <span>🧩 Mini Editor</span>
  <div class="actions">
    <span id="saveStatus"></span>
    <button id="runBtn" class="primary">▶ Rodar</button>
    <button id="saveBtn">💾 Baixar</button>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="html">HTML</button>
  <button class="tab-btn" data-tab="css">CSS</button>
  <button class="tab-btn" data-tab="js">JS</button>
  <button class="tab-btn" data-tab="preview">Preview</button>
</div>

<div class="toolbar" id="toolbar-html">
  <button class="highlight" data-snippet="html-boilerplate">📄 Esqueleto HTML</button>
  <button data-snippet="html-div">&lt;div&gt;</button>
  <button data-snippet="html-h1">&lt;h1&gt;</button>
  <button data-snippet="html-p">&lt;p&gt;</button>
  <button data-snippet="html-btn">&lt;button&gt;</button>
  <button data-snippet="html-img">&lt;img&gt;</button>
  <button data-snippet="html-a">&lt;a&gt;</button>
  <button id="copy-html">📋 Copiar</button>
  <button class="danger" id="clear-html">🗑️ Limpar</button>
</div>

<div class="toolbar hidden" id="toolbar-css">
  <button data-snippet="css-flex">flex center</button>
  <button data-snippet="css-grid">grid</button>
  <button data-snippet="css-media">@media</button>
  <button data-snippet="css-transition">transition</button>
  <button data-snippet="css-shadow">box-shadow</button>
  <button data-snippet="css-hover">:hover</button>
  <button id="copy-css">📋 Copiar</button>
  <button class="danger" id="clear-css">🗑️ Limpar</button>
</div>

<div class="toolbar hidden" id="toolbar-js">
  <button data-snippet="js-function">function</button>
  <button data-snippet="js-listener">addEventListener</button>
  <button data-snippet="js-query">querySelector</button>
  <button data-snippet="js-loop">for loop</button>
  <button data-snippet="js-fetch">fetch</button>
  <button data-snippet="js-console">console.log</button>
  <button id="copy-js">📋 Copiar</button>
  <button class="danger" id="clear-js">🗑️ Limpar</button>
</div>

<div class="panes">
  <div class="pane active" data-pane="html">
    <textarea id="htmlCode" spellcheck="false">&lt;h1&gt;MINECRAFT&lt;/h1&gt;</textarea>
  </div>
  <div class="pane" data-pane="css">
    <textarea id="cssCode" spellcheck="false">body {
  background: #0d1a0d;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

h1 {
  font-family: Arial, sans-serif;
  font-size: 60px;
  color: #55ff55;
  letter-spacing: 5px;
  text-shadow:
    4px 4px 0px #2a7a2a,
    8px 8px 0px #000;
}</textarea>
  </div>
  <div class="pane" data-pane="js">
    <textarea id="jsCode" spellcheck="false">// seu javascript aqui</textarea>
  </div>
  <div class="pane" data-pane="preview">
    <iframe id="previewFrame"></iframe>
  </div>
</div>

<footer>Seu código é salvo automaticamente neste navegador</footer>

<script>
  const tabBtns = document.querySelectorAll('.tab-btn');
  const panes = document.querySelectorAll('.pane');
  const toolbars = document.querySelectorAll('.toolbar');
  const htmlCode = document.getElementById('htmlCode');
  const cssCode = document.getElementById('cssCode');
  const jsCode = document.getElementById('jsCode');
  const saveStatus = document.getElementById('saveStatus');

  function showTab(name) {
    tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    panes.forEach(p => p.classList.toggle('active', p.dataset.pane === name));
    toolbars.forEach(t => t.classList.add('hidden'));
    const activeToolbar = document.getElementById('toolbar-' + name);
    if (activeToolbar) activeToolbar.classList.remove('hidden');
    if (name === 'preview') runCode();
  }

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => showTab(btn.dataset.tab));
  });

  function buildDoc() {
    const html = htmlCode.value;
    const css = cssCode.value;
    const js = jsCode.value;
    return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${css}</style></head><body>${html}<script>${js}<\/script></body></html>`;
  }

  function runCode() {
    document.getElementById('previewFrame').srcdoc = buildDoc();
  }

  document.getElementById('runBtn').addEventListener('click', () => {
    showTab('preview');
    runCode();
  });
